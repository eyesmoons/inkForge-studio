    </div>
        <nav class="nav">

      <a href="/hotrank.html" class="nav-item" data-title="每日热搜"><span class="icon">🔥</span> 每日热搜</a>

      <a href="/cover_maker.html" class="nav-item" data-title="封面制作"><span class="icon">🎨</span> 封面制作</a>
      <a href="/material_library.html" class="nav-item" data-title="素材库"><span class="icon">📦</span> 素材库</a>
      <a href="/skill.html" class="nav-item" data-title="写作技能"><span class="icon">🎯</span> 写作技能</a>

    </nav>
    <div class="sidebar-footer-area">
      <button class="sidebar-toggle" onclick="toggleSidebar()">
        <span class="toggle-arrow">◀</span>
        <span class="sidebar-collapse-text">收起菜单</span>
      </button>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">📅 历史上的今天</div>
      <div class="topbar-actions">
        <span id="current-date" class="date-display"></span>
        <button class="btn btn-primary" onclick="refreshData()">🔄 刷新</button>
        <!-- 公众号平台 -->
        <a class="wx-platform-btn" href="https://mp.weixin.qq.com" target="_blank" title="打开公众号平台">🔗 公众号平台</a>
        <!-- AI助手按钮 -->
        <div class="ai-assistant-btn" id="ai-assistant-btn" onclick="toggleAIAssistant()" title="AI助手">
          <span>🤖</span>
        </div>
        <!-- 用户菜单 -->
        <div class="user-menu" id="user-menu" onclick="toggleUserMenu()">
          <div class="user-avatar" id="user-avatar">U</div>
          <div class="user-name" id="user-name">用户</div>
          <div class="user-dropdown" id="user-dropdown">
            <div class="user-dropdown-item" onclick="showUserProfile()">
              <span>👤</span> 个人中心
            </div>
            <div class="user-dropdown-divider"></div>
            <div class="user-dropdown-item" onclick="doLogout()">
              <span>🚪</span> 退出登录
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="content">
      <!-- 统计卡片 -->
      <div class="stats-cards">
        <div class="stat-card">
          <div class="stat-icon">📜</div>
          <div class="stat-info">
            <div class="stat-value" id="total-events">-</div>
            <div class="stat-label">历史事件</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👶</div>
          <div class="stat-info">
            <div class="stat-value" id="birth-count">-</div>
            <div class="stat-label">出生人物</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚔️</div>
          <div class="stat-info">
            <div class="stat-value" id="war-count">-</div>
            <div class="stat-label">战争/政治</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🔬</div>
          <div class="stat-info">
            <div class="stat-value" id="tech-count">-</div>
            <div class="stat-label">科技/文化</div>
          </div>
        </div>
      </div>

      <!-- 筛选标签 -->
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">全部</button>
        <button class="tab-btn" data-filter="出生">👶 出生</button>
        <button class="tab-btn" data-filter="逝世">🕯️ 逝世</button>
        <button class="tab-btn" data-filter="战争">⚔️ 战争</button>
        <button class="tab-btn" data-filter="政治">🏛️ 政治</button>
        <button class="tab-btn" data-filter="科技">🔬 科技</button>
        <button class="tab-btn" data-filter="文化">🎭 文化</button>
        <button class="tab-btn" data-filter="体育">🏆 体育</button>
        <button class="tab-btn" data-filter="灾难">⚠️ 灾难</button>
      </div>

      <!-- 时间轴 -->
      <div class="timeline-container" id="timeline-container">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </main>
</div>

<script src="/common.js"></script>
