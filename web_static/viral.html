<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆款分析 · 墨锻工坊</title>
<link rel="stylesheet" href="/common.css">
<style>
/* 爆款分析页面专属样式 */
.viral-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.viral-days-select {
  display: flex;
  align-items: center;
  gap: 6px;
}

.viral-days-select span {
  font-size: 13px;
  color: var(--text2);
}

.viral-btn {
  padding: 6px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
}

.viral-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.viral-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.viral-fetch-btn {
  margin-left: auto;
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.viral-fetch-btn:hover {
  opacity: 0.85;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
}

.viral-fetch-btn:active {
  transform: translateY(0);
}

.viral-fetch-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.viral-fetch-btn .viral-spinner {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: viralSpin 0.6s linear infinite;
  display: none;
}

.viral-fetch-btn.loading .viral-spinner {
  display: block;
}

@keyframes viralSpin {
  to { transform: rotate(360deg); }
}

/* 汇总卡片 */
.viral-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.viral-summary-card {
  background: var(--card-bg, rgba(26,29,39,0.8));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}

.viral-summary-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
}

.viral-summary-card:nth-child(1)::before { background: linear-gradient(90deg, #07c160, #4ade80); }
.viral-summary-card:nth-child(2)::before { background: linear-gradient(90deg, #2563eb, #60a5fa); }
.viral-summary-card:nth-child(3)::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.viral-summary-card:nth-child(4)::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }

.viral-summary-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}

.viral-summary-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}

.viral-summary-card:nth-child(1) .viral-summary-value { color: #4ade80; }
.viral-summary-card:nth-child(2) .viral-summary-value { color: #60a5fa; }
.viral-summary-card:nth-child(3) .viral-summary-value { color: #fbbf24; }
.viral-summary-card:nth-child(4) .viral-summary-value { color: #a78bfa; }

.viral-summary-label {
  font-size: 12px;
  color: var(--text2);
  margin-top: 6px;
}

/* 文章列表 */
.viral-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.viral-item {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 16px;
  align-items: center;
  background: var(--card-bg, rgba(26,29,39,0.8));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  animation: viralFadeIn 0.4s ease-out both;
}

.viral-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.02), transparent);
  transform: translateX(-100%);
  transition: transform 0.5s;
}

.viral-item:hover::before {
  transform: translateX(100%);
}

.viral-item:hover {
  border-color: rgba(7, 193, 96, 0.3);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  transform: translateX(4px);
}

@keyframes viralFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 排名徽章 */
.viral-rank {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  flex-shrink: 0;
}

.viral-rank.gold { background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 2px 8px rgba(245,158,11,0.4); }
.viral-rank.silver { background: linear-gradient(135deg, #94a3b8, #cbd5e1); box-shadow: 0 2px 8px rgba(148,163,184,0.4); }
.viral-rank.bronze { background: linear-gradient(135deg, #d97706, #f59e0b); box-shadow: 0 2px 8px rgba(217,119,6,0.4); }
.viral-rank.normal { background: rgba(255,255,255,0.06); color: var(--text2); font-weight: 600; font-size: 14px; }

/* 文章信息 */
.viral-info {
  min-width: 0;
}

.viral-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}

.viral-date {
  font-size: 12px;
  color: var(--text2);
}

/* 数据指标 */
.viral-metrics {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
}

.viral-metric {
  text-align: center;
  min-width: 56px;
}

.viral-metric-value {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.2;
}

.viral-metric-value.read { color: #4ade80; }
.viral-metric-value.like { color: #f43f5e; }
.viral-metric-value.share { color: #60a5fa; }
.viral-metric-value.collect { color: #fbbf24; }

.viral-metric-label {
  font-size: 11px;
  color: var(--text2);
  margin-top: 2px;
}

/* 热度条 */
.viral-heat-bar {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}

.viral-heat-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #07c160, #4ade80);
  transition: width 0.8s ease-out;
}

/* 空状态 */
.viral-empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--text2);
}

.viral-empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.viral-empty-text {
  font-size: 14px;
  margin-bottom: 8px;
}

.viral-empty-hint {
  font-size: 12px;
  opacity: 0.6;
}

/* 错误提示 */
.viral-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.25);
  border-radius: 10px;
  padding: 16px 20px;
  color: #fca5a5;
  font-size: 13px;
  line-height: 1.6;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.viral-error-icon {
  font-size: 20px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* 账号信息 */
.viral-account-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text2);
}

.viral-account-name {
  font-weight: 600;
  color: var(--text);
}

/* 响应式 */
@media (max-width: 768px) {
  .viral-summary { grid-template-columns: repeat(2, 1fr); }
  .viral-item { grid-template-columns: 32px 1fr; gap: 12px; }
  .viral-metrics { grid-column: 1 / -1; justify-content: flex-start; gap: 12px; padding-left: 44px; }
}
</style>

<script>
// ── 状态 ──
let _viralDays = 3;
let _viralData = null;

// ── 时间范围切换 ──
function setDays(btn) {
  document.querySelectorAll('.viral-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _viralDays = parseInt(btn.dataset.days);
  // 如果已有数据，自动刷新
  if (_viralData) {
    fetchViralData();
  }
}

// ── 格式化数字 ──
function formatNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

// ── 获取爆款数据 ──
async function fetchViralData() {
  const btn = document.getElementById('viral-fetch-btn');
  const btnText = document.getElementById('viral-fetch-text');
  const infoText = document.getElementById('viral-info-text');

  if (!currentAccountId) {
    toast('请先选择一个公众号账号', 'error');
    return;
  }

  // 进入加载状态
  btn.classList.add('loading');
  btn.disabled = true;
  btnText.textContent = '获取中...';
  infoText.textContent = '正在从微信公众号平台拉取数据，请稍候...';

  try {
    const params = new URLSearchParams({
      account_id: currentAccountId,
      days: _viralDays,
    });
    const res = await fetch(`/api/article_stats?${params}`);
    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error || '获取数据失败');
    }

    _viralData = data;
    renderViralData(data);

    const accName = data.account_name || currentAccountId;
    const range = data.date_range ? `${data.date_range[0]} ~ ${data.date_range[1]}` : '';
    infoText.innerHTML = `<span class="viral-account-name">${accName}</span> · ${range} · 共 <strong>${data.total}</strong> 篇文章`;
    toast('数据获取成功', 'success');

  } catch (e) {
    console.error('获取爆款数据失败:', e);
    const content = document.getElementById('viral-content');
    content.innerHTML = `
      <div class="viral-error">
        <div class="viral-error-icon">⚠️</div>
        <div>
          <strong>获取数据失败</strong><br>
          ${e.message || '未知错误'}<br>
          <span style="opacity:0.7;font-size:12px;">提示：请确保 IP 已加入微信白名单，且公众号已开通数据统计权限</span>
        </div>
      </div>
    `;
    infoText.textContent = '数据获取失败';
    toast(e.message || '获取数据失败', 'error');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
    btnText.textContent = '📊 获取数据';
  }
}

// ── 渲染数据 ──
function renderViralData(data) {
  const articles = data.articles || [];
  const summary = document.getElementById('viral-summary');
  const content = document.getElementById('viral-content');

  if (!articles.length) {
    summary.style.display = 'none';
    content.innerHTML = `
      <div class="viral-empty">
        <div class="viral-empty-icon">📭</div>
        <div class="viral-empty-text">该时间范围内没有文章数据</div>
        <div class="viral-empty-hint">可能文章尚未被阅读，或所选时间范围内没有群发文章</div>
      </div>
    `;
    return;
  }

  // 汇总统计
  summary.style.display = '';
  const totalRead = articles.reduce((s, a) => s + (a.read_count || 0), 0);
  const totalLike = articles.reduce((s, a) => s + (a.like_count || 0), 0);
  const totalShare = articles.reduce((s, a) => s + (a.share_count || 0) + (a.share_user_count || 0), 0);

  document.getElementById('viral-total-articles').textContent = data.total;
  document.getElementById('viral-total-read').textContent = formatNum(totalRead);
  document.getElementById('viral-total-like').textContent = formatNum(totalLike);
  document.getElementById('viral-total-share').textContent = formatNum(totalShare);

  // 最高热度
  const maxHeat = Math.max(...articles.map(a => a.heat_score || 0), 1);

  // 文章列表
  let html = '<div class="viral-list">';
  articles.forEach((art, idx) => {
    const rank = idx + 1;
    const heatPct = maxHeat > 0 ? ((art.heat_score || 0) / maxHeat * 100) : 0;

    let rankClass = 'normal';
    if (rank === 1) rankClass = 'gold';
    else if (rank === 2) rankClass = 'silver';
    else if (rank === 3) rankClass = 'bronze';

    const title = art.title || '无标题';
    const date = art.publish_time || '';

    html += `
      <div class="viral-item" style="animation-delay:${idx * 0.05}s">
        <div class="viral-rank ${rankClass}">${rank}</div>
        <div class="viral-info">
          <div class="viral-title">${escapeHtml(title)}</div>
          <div class="viral-date">${date}</div>
          <div class="viral-heat-bar">
            <div class="viral-heat-fill" style="width:${heatPct}%"></div>
          </div>
        </div>
        <div class="viral-metrics">
          <div class="viral-metric">
            <div class="viral-metric-value read">${formatNum(art.read_count || 0)}</div>
            <div class="viral-metric-label">阅读</div>
          </div>
          <div class="viral-metric">
            <div class="viral-metric-value like">${formatNum(art.like_count || 0)}</div>
            <div class="viral-metric-label">点赞</div>
          </div>
          <div class="viral-metric">
            <div class="viral-metric-value share">${formatNum(art.share_count || 0 + art.share_user_count || 0)}</div>
            <div class="viral-metric-label">转发</div>
          </div>
          <div class="viral-metric">
            <div class="viral-metric-value collect">${formatNum(art.collect_count || 0)}</div>
            <div class="viral-metric-label">收藏</div>
          </div>
        </div>
      </div>
    `;
  });
  html += '</div>';

  content.innerHTML = html;
}

// ── HTML 转义 ──
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── 页面初始化 ──
document.addEventListener('DOMContentLoaded', function() {
  // 高亮当前导航项
  const currentPage = window.location.pathname;
  document.querySelectorAll('.nav-item').forEach(item => {
    if (item.getAttribute('href') === currentPage) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });

  loadAccounts().then(() => {
    // 自动加载数据
    if (currentAccountId) {
      fetchViralData();
    }
  });
  startSSE();
});
</script>
